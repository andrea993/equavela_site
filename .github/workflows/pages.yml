name: Pages

# The site, with the user manual of the equavela_doc submodule at /manual/. The manual is taken
# at the head of its main branch on every run, so the daily run publishes its latest version.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Take the latest manual
        run: git submodule update --remote equavela_doc
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html style.css assets CNAME favicon.ico apple-touch-icon.png site.webmanifest robots.txt _site/
          cp -r equavela_doc/site/manual _site/manual
          touch _site/.nojekyll
      - name: Write the sitemap
        run: |
          cd _site
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://equavela.org/</loc></url>'
            find manual -name '*.html' | sort | sed 's|/index.html$|/|' | while read -r page; do
              echo "  <url><loc>https://equavela.org/$page</loc></url>"
            done
            echo '</urlset>'
          } > sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
